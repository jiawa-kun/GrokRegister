name: CI

on:
  push:
    branches: [beta, beta_dev, main, master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck (web)
        run: npm run typecheck

      - name: Concurrent register verify
        run: npm run verify:concurrent-register

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python unit tests
        working-directory: register
        run: python -m unittest discover -s tests -v
