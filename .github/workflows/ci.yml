name: CI

on:
  push:
    branches: [beta_dev]
  pull_request:
    branches: [beta_dev]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (web)
        run: npm run typecheck

      - name: Typecheck (server) + concurrent register verify
        run: npm run verify:concurrent-register
